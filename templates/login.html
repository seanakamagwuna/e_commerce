{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sign in{% endblock %} | ShopFront</title>
    <link rel="stylesheet" href="{% static 'login.css' %}">
</head>
<body class="auth-body">

    <main class="auth-main">
        <div class="auth-card">
            <a href="{% url 'product_list' %}" class="auth-logo">ShopFront</a>
            <h1 class="auth-heading">Welcome back</h1>
            <p class="auth-subheading">Sign in to your account to continue</p>

            {% if error %}
                <div class="form-error">{{ error }}</div>
            {% endif %}

            <form method="post" action="">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">

                <div class="field-group">
                    <label class="field-label" for="id_username">Username</label>
                    <input type="text" name="username" id="id_username" class="field-input" required autofocus>
                </div>

                <div class="field-group">
                    <label class="field-label" for="id_password">Password</label>
                    <input type="password" name="password" id="id_password" class="field-input" required>
                </div>

                <div class="auth-row">
                    <a href="#" class="auth-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Sign in</button>
            </form>

            <p class="auth-footer">New to ShopFront? <a href="{% url 'accounts:signup' %}" class="auth-link">Create an account</a></p>
        </div>
    </main>

</body>
</html>
